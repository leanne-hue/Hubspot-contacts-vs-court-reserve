name: Update dashboard

on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 15 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "data/court-reserve/**"

concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard - only proceed at 10:00 America/Toronto (scheduled runs)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=America/Toronto date +%H)
            echo "Current Toronto hour: $H"
            if [ "$H" != "10" ]; then
              echo "Not 10:00 in Toronto - skipping this trigger."
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Python
        if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        if: env.SKIP != '1'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python pipeline/run.py

      - name: Upload outreach lists as a PRIVATE artifact
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: outreach-lists
          path: outreach_lists/
          retention-days: 30

      - name: Commit and push refreshed dashboard
        if: env.SKIP != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Dashboard refresh"
            git push
          fi
